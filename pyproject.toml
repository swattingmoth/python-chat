[project]
name = "python-chat"
version = "0.1.0"
description = "Python project skeleton for an LLM chatbot. Features pytest testing, strict mypy type checking, uv for fast dependency management, and src/ layout."
readme = "README.md"
authors = [
    { name = "swattingmoth", email = "swattingmoth@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "attrs>=26.1.0",
    "dotenv>=0.9.9",
    "gradio>=6.14.0",
    "openai>=2.38.0",
    "python-env>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --tb=short"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = true
mypy_path = ["src"]
# Run with: uv run mypy src
# or after install: uv run mypy


[project]
name = "python-chat"
version = "0.1.0"
description = "Production-grade LLM chatbot using xAI SDK (native, not compat). Streaming + tools (client/server) + image gen + Gradio UI. Full type safety (mypy strict), tests for every public API, uv packaging."
readme = "README.md"
authors = [
    { name = "swattingmoth", email = "swattingmoth@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "attrs>=26.1.0",
    "dotenv>=0.9.9",
    "gradio>=6.14.0",
    "protobuf>=6.33.6",
    "python-env>=1.0.0",
    "xai-sdk>=1.15.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "mypy>=1.13.0",
    "pytest-cov>=7.1.0",
    "types-protobuf>=7.34.1.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --tb=short"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = true
mypy_path = ["src"]
[[tool.mypy.overrides]]
module = ["xai_sdk", "xai_sdk.*"]
ignore_missing_imports = true


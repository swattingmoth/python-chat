name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, Mypy, Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run mypy
        run: uv run mypy --python-executable .venv/bin/python src

      - name: Run ruff
        run: uv run ruff check .

  deploy-supabase:
    name: Deploy Supabase DB and Buckets
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
    concurrency:
      group: deploy-supabase-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare IPv4-compatible DB URL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_DB_URL: ${{ secrets.SUPABASE_POOLER_DB_URL }}
        run: |
          python3 <<'PY'
          import os
          import socket
          from urllib.parse import quote, urlsplit, urlunsplit

          def parse_postgres_url(secret_name: str, value: str) -> object:
              parts = urlsplit(value)
              if parts.scheme not in {"postgres", "postgresql"} or parts.hostname is None:
                  raise SystemExit(
                      f"{secret_name} must be a valid PostgreSQL connection string."
                  )
              return parts

          pooler_url = os.environ.get("SUPABASE_POOLER_DB_URL", "").strip()
          direct_url = os.environ.get("SUPABASE_DB_URL", "").strip()

          if pooler_url:
              parse_postgres_url("SUPABASE_POOLER_DB_URL", pooler_url)
              resolved_url = pooler_url
          elif direct_url:
              parts = parse_postgres_url("SUPABASE_DB_URL", direct_url)

              try:
                  ipv4_info = socket.getaddrinfo(
                      parts.hostname,
                      parts.port or 5432,
                      socket.AF_INET,
                      socket.SOCK_STREAM,
                  )
              except socket.gaierror as exc:
                  raise SystemExit(
                      "GitHub-hosted runners could not resolve an IPv4 address for "
                      f"{parts.hostname}. Set SUPABASE_POOLER_DB_URL to Supabase's "
                      "IPv4 pooler connection string. "
                      f"Original resolution error: {exc}."
                  ) from exc

              if not ipv4_info:
                  raise SystemExit(
                      "GitHub-hosted runners resolved no IPv4 addresses for "
                      f"{parts.hostname}. Set SUPABASE_POOLER_DB_URL to Supabase's "
                      "IPv4 pooler connection string."
                  )

              # getaddrinfo returns (family, type, proto, canonname, sockaddr).
              ip_address = ipv4_info[0][4][0]

              resolved_userinfo = ""
              if parts.username is not None:
                  resolved_userinfo = quote(parts.username, safe="")
                  if parts.password is not None:
                      resolved_userinfo = (
                          f"{resolved_userinfo}:{quote(parts.password, safe='')}"
                      )
                  resolved_userinfo = f"{resolved_userinfo}@"

              resolved_netloc = f"{resolved_userinfo}{ip_address}"
              if parts.port is not None:
                  resolved_netloc = f"{resolved_netloc}:{parts.port}"

              resolved_url = urlunsplit(
                  (
                      parts.scheme,
                      resolved_netloc,
                      parts.path,
                      parts.query,
                      parts.fragment,
                  )
              )
          else:
              raise SystemExit(
                  "Set SUPABASE_POOLER_DB_URL (preferred for GitHub Actions) or "
                  "SUPABASE_DB_URL."
              )

          github_env = os.environ.get("GITHUB_ENV")
          if github_env is None:
              raise SystemExit(
                  "GITHUB_ENV environment variable not found. GitHub Actions "
                  "should provide it automatically for workflow steps."
              )

          for value in (direct_url, pooler_url, resolved_url):
              if value:
                  print(f"::add-mask::{value}")
          with open(github_env, "a", encoding="utf-8") as env_file:
              env_file.write(f"SUPABASE_DEPLOY_DB_URL={resolved_url}\n")
          PY

      - name: Apply Supabase migrations
        run: |
          npx --yes supabase@2.106.0 db push --db-url "$SUPABASE_DEPLOY_DB_URL"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Ensure storage buckets exist
        run: |
          psql "$SUPABASE_DEPLOY_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into storage.buckets (
            id,
            name,
            public,
            file_size_limit,
            allowed_mime_types
          )
          values
            (
              'images',
              'images',
              true,
              20971520,
              array['image/png', 'image/jpeg', 'image/webp']::text[]
            ),
            (
              'chat-logs',
              'chat-logs',
              false,
              10485760,
              array['application/x-ndjson', 'application/json', 'text/plain']::text[]
            )
          on conflict (id)
          do update
          set
            name = excluded.name,
            public = excluded.public,
            file_size_limit = excluded.file_size_limit,
            allowed_mime_types = excluded.allowed_mime_types;
          SQL

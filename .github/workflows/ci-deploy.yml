name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, Mypy, Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run mypy
        env:
          MYPYPATH: src:.venv/lib/python3.13/site-packages
        run: uv run mypy --python-executable .venv/bin/python src

      - name: Run ruff
        run: uv run ruff check .

  deploy-supabase:
    name: Deploy Supabase DB and Buckets
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
    concurrency:
      group: deploy-supabase-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate SUPABASE_DB_URL secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL secret is not set"
            exit 1
          fi

      - name: Apply Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npx --yes supabase@2.106.0 db push --db-url "$SUPABASE_DB_URL"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Ensure storage buckets exist
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into storage.buckets (
            id,
            name,
            public,
            file_size_limit,
            allowed_mime_types
          )
          values
            (
              'images',
              'images',
              true,
              20971520,
              array['image/png', 'image/jpeg', 'image/webp']::text[]
            ),
            (
              'chat-logs',
              'chat-logs',
              false,
              10485760,
              array['application/x-ndjson', 'application/json', 'text/plain']::text[]
            )
          on conflict (id)
          do update
          set
            name = excluded.name,
            public = excluded.public,
            file_size_limit = excluded.file_size_limit,
            allowed_mime_types = excluded.allowed_mime_types;
          SQL
